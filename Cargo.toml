[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/discern-text", "crates/discern-sql", "crates/discern-db", "crates/discern-core", "crates/discern-workspace", "crates/discern-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# internal crates
discern-text = { path = "crates/discern-text" }
discern-sql = { path = "crates/discern-sql" }
discern-db = { path = "crates/discern-db" }
discern-core = { path = "crates/discern-core" }
discern-ui = { path = "crates/discern-ui" }
discern-workspace = { path = "crates/discern-workspace" }

# external
ropey = "=1.6.1"
thiserror = "=2.0.21"
async-trait = "=0.1.92"
futures-core = "=0.3.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
gpui-kit = { version = "=0.9.1", features = ["tree-sitter-sql"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1            # editor UI is unusable at opt-level 0
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
